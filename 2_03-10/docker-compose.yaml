services:
  frontend:
    image: grgonij/example-frontend
    ports:
      - 5001:5001
  backend:
    image: grgonij/example-backend
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
  redis:
    image: redis
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./database:/var/lib/postgresql
